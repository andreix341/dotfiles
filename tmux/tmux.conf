set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g automatic-rename on
set-option -g status-interval 5

set -g mouse on

unbind C-b
set -g prefix `
bind ` send-prefix 

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on 

bind | split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind-key x kill-pane

set -s escape-time 0
set -g renumber-windows on

set -g @plugin 'tmux-plugin/tpm'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "#241D33"

# Moonveil palette map (must come BEFORE plugin run; plugin skips pre-set vars)
set -g @thm_bg   "#000000"
set -g @thm_fg   "#EEEEEE"
set -g @thm_rosewater "#F280B0"
set -g @thm_flamingo  "#F06C6C"
set -g @thm_pink      "#F280B0"
set -g @thm_mauve     "#C792EA"
set -g @thm_red       "#F06C6C"
set -g @thm_maroon    "#F06C6C"
set -g @thm_peach     "#E2A76F"
set -g @thm_yellow    "#E2A76F"
set -g @thm_green     "#5FB878"
set -g @thm_teal      "#98C379"
set -g @thm_sky       "#8FB9D8"
set -g @thm_sapphire  "#8FB9D8"
set -g @thm_blue      "#8FB9D8"
set -g @thm_lavender  "#B5B9F0"

set -g @thm_subtext_1 "#C8C8C8"
set -g @thm_subtext_0 "#A5A5A5"
set -g @thm_overlay_2 "#C8C8C8"
set -g @thm_overlay_1 "#A5A5A5"
set -g @thm_overlay_0 "#6D6964"
set -g @thm_surface_2 "#241D33"
set -g @thm_surface_1 "#241D33"
set -g @thm_surface_0 "#241D33"
set -g @thm_mantle    "#000000"
set -g @thm_crust     "#000000"

run '~/.tmux/plugins/tpm/tpm'
