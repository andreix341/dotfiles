[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.0
    capsule = true
    capsule_thickness = 0.74999998696148396
    center = [ "clock", "notes" ]
    enabled = true
    end = [ "tray", "network", "battery", "volume", "notifications", "control-center" ]
    margin_ends = 0
    padding = 3
    radius = 11
    scale = 0.95000000670552254
    shadow = false
    start = [ "launcher", "workspaces" ]
    widget_spacing = 4

        [bar.default.monitor.HDMI-A-1]
        center = [ "media" ]
        end = [ "tray", "volume", "sysmon", "control-center" ]
        start = [ "launcher", "workspaces" ]

        [bar.default.monitor.eDP-1]
        center = [ "cat", "clock", "notes" ]

[config]

[control_center]
sidebar = "full"
sidebar_section = "full"
width = 740

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "keyboard_layout"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 925.0
    cy = 518.0
    output = "eDP-1"
    rotation = 0.0
    type = "media_player"

[dock]
auto_hide = true
reserve_space = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

[plugins]
enabled = [ "noctalia/notes", "dotnetrob/cat", "thepunkoff/pomodoro", "noctalia/timer", "jamesfeeder/special-workspaces" ]

[shell]
font_family = "GohuFont uni11 Nerd Font"
screen_time_enabled = true
telemetry_enabled = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true

[templates]

[hooks]
theme_mode_changed = [ "noctalia msg wallpaper-next", "pkill -SIGUSR1 nvim" ]

[theme]
builtin = "Catppuccin"
community_palette = "Mine"
custom_palette = "Moonveil"
mode = "dark"
pure_black_dark = true
source = "custom"
wallpaper_scheme = "m3-monochrome"

[wallpaper]
directory = "/home/pumk/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/pumk/Pictures/wallpapers/2_black.jpg"

    [wallpaper.last]
    path = "/home/pumk/Pictures/wallpapers/2_black.jpg"

[widget.audio_visualizer]
bands = 23
width = 177

[widget.cat]
cat_color = "tertiary"
cat_color_mode = "custom"
type = "dotnetrob/cat:cat"
walk_threshold = 10

[widget.clock]
anchor = true

[widget.control-center]
glyph = "cat"

[widget.launcher]
color = "primary"
custom_image = "/usr/share/icons/arch.png"
custom_image_colorize = true
scale = 1.3500000000000001

[widget.media]
max_length = 535

[widget.network]
show_label = false

[widget.notes]
type = "noctalia/notes:notes"

[widget.sysmon]
show_value = true
stat = "ram_pct"
visualization = "none"

[widget.workspaces]
active_pill_size = 1.0
capsule_padding = 7
scale = 1.3
style = "focus_hint"

    [widget.workspaces.actions]
    scroll_down = "none"
    scroll_up = "none"
