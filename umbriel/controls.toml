[keybinds]
"Mod+T" = { action = "spawn kitty", repeat = false }
"Mod+E" = { action = "spawn luciole", repeat = false }
"Mod+N" = { action = "spawn kitty -e nvim", repeat = false }
"Ctrl+Shift+Escape" = { action = "spawn kitty -e btop", repeat = false }
"Mod+U" = { action = "spawn cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy", repeat = false }
"Mod+F1" = { action = "spawn hyprpicker -a", repeat = false }
"Mod+F2" = { action = "spawn togglemangohud", repeat = false }
"Mod+F5" = { action = "config-reload", repeat = false }
"Mod+R" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+M" = { action = "spawn noctalia msg session lock", repeat = false }
"Mod+P" = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"Mod+W" = { action = "window-close", repeat = false }
"Mod+B" = { action = "window-toggle-floating", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Alt+Shift_L" = { release = "keyboard-layout-next", repeat = false }

"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+K" = "window-focus-up"
"Mod+J" = "window-focus-down"
"Mod+S" = { action = "scratchpad-toggle magic", repeat = false }
"Mod+Shift+S" = { action = "window-move-to-scratchpad magic", repeat = false }
"Mod+1" = { action = "workspace-switch --name 1", repeat = false }
"Mod+2" = { action = "workspace-switch --name 2", repeat = false }
"Mod+3" = { action = "workspace-switch --name 3", repeat = false }
"Mod+4" = { action = "workspace-switch --name 4", repeat = false }
"Mod+5" = { action = "workspace-switch --name 5", repeat = false }
"Mod+Shift+1" = { action = "window-move-to-workspace --name 1", repeat = false }
"Mod+Shift+2" = { action = "window-move-to-workspace --name 2", repeat = false }
"Mod+Shift+3" = { action = "window-move-to-workspace --name 3", repeat = false }
"Mod+Shift+4" = { action = "window-move-to-workspace --name 4", repeat = false }
"Mod+Shift+5" = { action = "window-move-to-workspace --name 5", repeat = false }
"Mod+Z" = { action = "workspace-switch --name Z", repeat = false }
"Mod+X" = { action = "workspace-switch --name X", repeat = false }
"Mod+C" = { action = "workspace-switch --name C", repeat = false }
"Mod+V" = { action = "workspace-switch --name V", repeat = false }
"Mod+Shift+Z" = { action = "window-move-to-workspace --name Z", repeat = false }
"Mod+Shift+X" = { action = "window-move-to-workspace --name X", repeat = false }
"Mod+Shift+C" = { action = "window-move-to-workspace --name C", repeat = false }
"Mod+Shift+V" = { action = "window-move-to-workspace --name V", repeat = false }

"Mod+Print" = { action = "spawn hyprshot -m output", repeat = false }
"Print" = { action = "spawn hyprshot -m region --clipboard-only", repeat = false }
"Mod+Shift+Print" = { action = "spawn hyprshot -m window", repeat = false }
"Mod+Alt+Print" = { action = "spawn hyprcap rec region -c -n", repeat = false }
"XF86AudioRaiseVolume" = { action = "spawn wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true }
"XF86AudioMicMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn brightnessctl -e4 -n2 set 5%+", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn brightnessctl -e4 -n2 set 5%-", allow_when_locked = true }
"XF86AudioNext" = { action = "spawn playerctl next", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn playerctl play-pause", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn playerctl play-pause", allow_when_locked = true, repeat = false }
"XF86AudioPrev" = { action = "spawn playerctl previous", allow_when_locked = true, repeat = false }

[[scratchpad]]
name = "magic"

[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^hyprland-run$"
default_floating = true
default_position = { anchor = "bottom_left", x = 20, y = 0 }

[[window_rule]]
match.app_id = "^org[.]kde[.]kcalc$"
default_floating = true

[[window_rule]]
match.app_id = "^org[.]gnome[.]FileRoller$"
default_floating = true
default_floating_size_px = { width = 1000, height = 700 }

[[window_rule]]
match.app_id = "^vesktop$"
default_output = "HDMI-A-1"
default_workspace = "Z"

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false
